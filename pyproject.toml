[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-window-hierarchical-summarizer"
version = "0.1.0"
description = "Recursive semantic tree summarizer maintaining multi-resolution context zooms for long-horizon agent workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-window-hierarchical-summarizer = "context_window_hierarchical_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_window_hierarchical_summarizer*"]
